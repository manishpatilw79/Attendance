<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timecard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#16233a;--slate:#5c6b7d;--paper:#f6f5f2;--panel:#ffffff;--line:#e1ddd3;
  --day:#b8842f;--night:#2c4a68;--ot:#a4402f;--txt:#16233a;--good:#2f6d4f;
}
:root[data-theme="dark"]{
  --navy:#0d1520;--slate:#9aa6b5;--paper:#121a26;--panel:#1a2536;--line:#2c3a50;
  --day:#c99a4a;--night:#5a86ac;--ot:#d47a68;--txt:#eef0f3;--good:#5aa87c;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--txt);font-family:'Inter',sans-serif;padding:0 0 90px;}
h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px;}
.hidden{display:none !important;}

#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);}
.login-box{background:var(--panel);padding:36px 30px;border-radius:8px;width:320px;max-width:90vw;}
.login-box h1{color:var(--txt);font-size:1.6rem;margin-bottom:4px;}
.login-box .sub{color:var(--slate);font-size:0.8rem;margin-bottom:20px;}
.login-box input{width:100%;padding:10px;margin-bottom:12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-family:'Inter',sans-serif;}
.login-box button{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:4px;font-weight:600;cursor:pointer;}
.login-err{color:var(--ot);font-size:0.78rem;margin-top:8px;display:none;}
.login-err.show{display:block;}

.topbar{background:var(--navy);color:#f2f0ea;padding:22px 20px;margin-bottom:24px;}
.topbar-inner{max-width:1040px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:1.6rem;color:#fff;}
.topbar .sub{font-size:0.75rem;color:#aab3c2;}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.icon-toggle,.export-btn,.logout-btn,.tab-btn{
  background:transparent;border:1px solid #4a5b78;color:#e6e9ef;padding:7px 12px;font-size:0.75rem;
  cursor:pointer;border-radius:4px;font-family:'Inter',sans-serif;
}
.icon-toggle{font-size:1rem;padding:6px 10px;}
.icon-toggle:hover,.export-btn:hover,.logout-btn:hover{background:#243756;}

.rates,.entry,.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:20px;}
.rates{display:flex;gap:20px;flex-wrap:wrap;}
.rate-field{display:flex;flex-direction:column;gap:4px;}
.rate-field label{font-size:0.68rem;color:var(--slate);}
.rate-field input{font-size:0.9rem;font-weight:600;border:none;border-bottom:2px solid var(--navy);background:transparent;width:95px;color:var(--txt);padding:3px 0;}
.rate-field input:focus{outline:none;border-color:var(--day);}

.entry{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field.wide{grid-column:1/-1;}
.field label{font-size:0.68rem;color:var(--slate);}
.field input,.field select{padding:8px 9px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-family:'Inter',sans-serif;font-size:0.86rem;}
.shift-toggle{display:flex;gap:6px;}
.shift-toggle button{flex:1;padding:8px 4px;border:1px solid var(--line);background:var(--paper);color:var(--txt);border-radius:4px;cursor:pointer;font-size:0.8rem;}
.shift-toggle button.active[data-v="day"]{background:var(--day);color:#fff;border-color:var(--day);}
.shift-toggle button.active[data-v="night"]{background:var(--night);color:#fff;border-color:var(--night);}
.form-actions{grid-column:1/-1;display:flex;gap:10px;}
.add-btn{flex:1;background:var(--navy);color:#fff;border:none;border-radius:4px;padding:11px;font-weight:600;cursor:pointer;}
.add-btn:disabled{opacity:.6;}
.cancel-btn{background:transparent;color:var(--slate);border:1px solid var(--line);border-radius:4px;padding:11px 16px;cursor:pointer;display:none;}
.cancel-btn.show{display:block;}
.editing-flag{grid-column:1/-1;font-size:0.76rem;color:var(--day);font-weight:600;display:none;}
.editing-flag.show{display:block;}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:18px;}
.summary .cell{background:var(--panel);padding:13px 14px;}
.summary .num{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;}
.summary .lbl{font-size:0.65rem;color:var(--slate);margin-top:2px;}

.search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search-row input,.search-row select{padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--txt);font-family:'Inter',sans-serif;font-size:0.85rem;}
.search-row input{flex:1;min-width:160px;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:0.8rem;}
.card .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.card .date{font-weight:600;}
.badge{padding:2px 8px;font-size:0.65rem;border-radius:3px;color:#fff;font-weight:500;}
.badge.day{background:var(--day);}.badge.night{background:var(--night);}
.badge.emp{background:var(--good);}
.card .line{display:flex;justify-content:space-between;color:var(--slate);margin-bottom:3px;font-size:0.76rem;}
.card .line b{color:var(--txt);font-weight:600;}
.ot-tag{color:var(--ot);}
.card .remark{color:var(--slate);font-size:0.74rem;margin-top:6px;font-style:italic;}
.card .acts{display:flex;gap:6px;margin-top:9px;}
.card .acts button{flex:1;background:none;border:1px solid var(--line);color:var(--slate);border-radius:4px;padding:5px;font-size:0.7rem;cursor:pointer;}
.card .acts button:hover{border-color:var(--navy);color:var(--navy);}
.card .acts button.del:hover{border-color:var(--ot);color:var(--ot);}
.empty{padding:40px 10px;text-align:center;color:var(--slate);font-size:0.85rem;grid-column:1/-1;}

.month-pick{display:flex;gap:6px;align-items:center;}
.month-pick input{padding:5px 7px;border:1px solid #4a5b78;border-radius:4px;background:transparent;color:#e6e9ef;font-size:0.75rem;}
.admin-link{text-align:center;font-size:0.75rem;color:var(--slate);margin-top:14px;cursor:pointer;text-decoration:underline;}
.emp-card input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-size:0.78rem;margin-bottom:5px;}
.emp-card .eid{font-weight:600;margin-bottom:6px;}
.rec-card input,.rec-card select{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-size:0.76rem;margin-bottom:5px;}

.tabs{display:flex;gap:8px;margin-bottom:18px;}
.tab-btn{color:var(--txt);border-color:var(--line);background:var(--panel);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

.emp-form{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:6px;}
.emp-form input{padding:8px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-size:0.82rem;}
.emp-row{display:grid;grid-template-columns:repeat(6,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.82rem;}
.emp-row input{padding:6px 7px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--txt);font-size:0.8rem;width:100%;}
.emp-row .del{background:none;border:1px solid var(--line);color:var(--ot);border-radius:4px;padding:5px 9px;cursor:pointer;font-size:0.72rem;}

@media(max-width:760px){
  .entry{grid-template-columns:repeat(2,1fr);}
  .summary{grid-template-columns:repeat(2,1fr);}
  .emp-form,.emp-row{grid-template-columns:1fr 1fr;}
}
@media print{
  .topbar .top-actions,.entry,.card .acts,.search-row,.tabs{display:none !important;}
  body{padding:0;}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>Timecard</h1>
    <div class="sub">Sign in with your company ID</div>
    <input type="text" id="loginId" placeholder="Company ID">
    <input type="password" id="loginPin" placeholder="PIN">
    <button id="loginBtn">Login</button>
    <div class="login-err" id="loginErr">Invalid ID or PIN.</div>
    <div class="sub" style="margin-top:14px;font-size:0.72rem;">Admin? Sign in with your admin ID and password above.</div>
  </div>
</div>

<!-- EMPLOYEE VIEW -->
<div id="appScreen" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div><h1>Timecard</h1><div class="sub" id="userLabel"></div></div>
      <div class="top-actions">
        <div class="month-pick">
          <input type="month" id="exportMonth">
          <button class="export-btn" id="exportCsv">CSV</button>
          <button class="export-btn" id="exportPdf">PDF</button>
        </div>
        <button class="icon-toggle" id="themeToggle">🌙</button>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="rates">
      <div class="rate-field"><label>Hourly rate</label><input type="number" id="hourlyRate" step="0.01" value="0"></div>
      <div class="rate-field"><label>OT multiplier (×)</label><input type="number" id="otMultiplier" step="0.1" value="1.5"></div>
      <div class="rate-field"><label>OT rate override (fixed/hr)</label><input type="number" id="otRate" step="0.01" value="0"></div>
      <div class="rate-field"><label>Standard hrs/day</label><input type="number" id="stdHours" step="0.5" value="8"></div>
    </div>
    <form class="entry" id="entryForm">
      <div class="editing-flag" id="editingFlag">Editing existing record — update or cancel below.</div>
      <div class="field"><label>Date</label><input type="date" id="f-date" required></div>
      <div class="field">
        <label>Shift</label>
        <div class="shift-toggle">
          <button type="button" data-v="day" class="active">Day</button>
          <button type="button" data-v="night">Night</button>
        </div>
        <input type="hidden" id="f-shift" value="day">
      </div>
      <div class="field"><label>Check in</label><input type="time" id="f-in" required></div>
      <div class="field"><label>Check out (incl. OT)</label><input type="time" id="f-out" required></div>
      <div class="field"><label>Break (min)</label><input type="number" id="f-break" value="0" min="0"></div>
      <div class="field wide"><label>Remark</label><input type="text" id="f-note" placeholder="optional note"></div>
      <div class="form-actions">
        <button type="submit" class="add-btn" id="submitBtn">Add record</button>
        <button type="button" class="cancel-btn" id="cancelBtn">Cancel edit</button>
      </div>
    </form>
    <div class="summary" id="summary"></div>
    <div class="search-row"><input type="text" id="searchBox" placeholder="Search by date, shift or remark..."></div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<!-- ADMIN VIEW -->
<div id="adminScreen" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div><h1>Admin Panel</h1><div class="sub">Full database control</div></div>
      <div class="top-actions">
        <button class="icon-toggle" id="themeToggleA">🌙</button>
        <button class="logout-btn" id="logoutBtnA">Logout</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button class="tab-btn active" id="tabEmp">Employees</button>
      <button class="tab-btn" id="tabAtt">All Attendance</button>
    </div>

    <div id="adminEmployees">
      <div class="panel">
        <div class="emp-form">
          <input id="ne-id" placeholder="Company ID">
          <input id="ne-name" placeholder="Name">
          <input id="ne-pin" placeholder="PIN">
          <input id="ne-rate" placeholder="Hourly rate" type="number" step="0.01">
          <input id="ne-std" placeholder="Std hrs/day" type="number" step="0.5" value="8">
          <button class="add-btn" id="addEmpBtn">Add employee</button>
        </div>
      </div>
      <div class="panel" id="empList"></div>
    </div>

    <div id="adminAttendance" class="hidden">
      <div class="search-row">
        <select id="filterEmp"><option value="">All employees</option></select>
        <input type="month" id="filterMonth">
        <input type="text" id="adminSearch" placeholder="Search date, shift, remark...">
        <button class="export-btn" id="adminExportCsv" style="border-color:var(--navy);color:var(--navy);">Download CSV</button>
      </div>
      <div class="cards" id="adminCards"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://cpwlammdgzssvecpodtz.supabase.co";
const SUPABASE_KEY = "sb_publishable_IKIbDWtWSysqtj0YUivHQA_Js49hCk5";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const ADMIN_ID = "admin";
const ADMIN_PIN = "admin123";

let currentUser = null, records = [], editingId = null;
let rates = {hourlyRate:0, otMultiplier:1.5, otRate:0, stdHours:8};
let allEmployees = [], allAttendance = [];

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const icon = t==='dark' ? '☀️' : '🌙';
  document.getElementById('themeToggle').textContent = icon;
  document.getElementById('themeToggleA').textContent = icon;
  localStorage.setItem('tc_theme', t);
}
applyTheme(localStorage.getItem('tc_theme') || 'light');
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('themeToggleA').addEventListener('click', toggleTheme);

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.classList.remove('show');
  if(!id || !pin) return;
  if(id.toLowerCase()===ADMIN_ID && pin===ADMIN_PIN){
    localStorage.setItem('tc_session','__admin__');
    enterAdmin(); return;
  }
  try{
    const {data, error} = await sb.from('employees').select('*').eq('company_id', id).eq('pin', pin).single();
    if(error || !data){ errEl.classList.add('show'); return; }
    currentUser = data;
    localStorage.setItem('tc_session', id);
    enterApp();
  }catch(e){ errEl.classList.add('show'); }
}

async function trySession(){
  const saved = localStorage.getItem('tc_session');
  if(!saved) return;
  if(saved==='__admin__'){ enterAdmin(); return; }
  try{
    const {data} = await sb.from('employees').select('*').eq('company_id', saved).single();
    if(data){ currentUser = data; enterApp(); }
  }catch(e){}
}

function logoutAll(){
  localStorage.removeItem('tc_session');
  currentUser = null;
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('adminScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginId').value=''; document.getElementById('loginPin').value='';
}
document.getElementById('logoutBtn').addEventListener('click', logoutAll);
document.getElementById('logoutBtnA').addEventListener('click', logoutAll);

/* ===== EMPLOYEE VIEW ===== */
function enterApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('adminScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  document.getElementById('userLabel').textContent = currentUser.name + ' · ' + currentUser.company_id;
  rates = {
    hourlyRate: Number(currentUser.hourly_rate)||0,
    otMultiplier: Number(currentUser.ot_multiplier)||1.5,
    otRate: Number(currentUser.ot_rate)||0,
    stdHours: Number(currentUser.std_hours)||8
  };
  document.getElementById('hourlyRate').value = rates.hourlyRate;
  document.getElementById('otMultiplier').value = rates.otMultiplier;
  document.getElementById('otRate').value = rates.otRate;
  document.getElementById('stdHours').value = rates.stdHours;
  document.getElementById('exportMonth').value = new Date().toISOString().slice(0,7);
  loadRecords();
}

['hourlyRate','otMultiplier','otRate','stdHours'].forEach(id=>{
  document.getElementById(id).addEventListener('change', async ()=>{
    rates = {
      hourlyRate: parseFloat(document.getElementById('hourlyRate').value)||0,
      otMultiplier: parseFloat(document.getElementById('otMultiplier').value)||1.5,
      otRate: parseFloat(document.getElementById('otRate').value)||0,
      stdHours: parseFloat(document.getElementById('stdHours').value)||8
    };
    try{
      await sb.from('employees').update({
        hourly_rate: rates.hourlyRate, ot_multiplier: rates.otMultiplier,
        ot_rate: rates.otRate, std_hours: rates.stdHours
      }).eq('company_id', currentUser.company_id);
    }catch(e){}
    render();
  });
});

const shiftBtns = document.querySelectorAll('#entryForm .shift-toggle button');
shiftBtns.forEach(b=>b.addEventListener('click',()=>{
  shiftBtns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('f-shift').value = b.dataset.v;
}));

function computeHours(inT,outT,breakMin){
  let [ih,im]=inT.split(':').map(Number), [oh,om]=outT.split(':').map(Number);
  let start=ih*60+im, end=oh*60+om;
  if(end<=start) end+=24*60;
  return Math.max(0,(end-start-(Number(breakMin)||0))/60);
}
function computeRecord(rec, r){
  r = r || rates;
  const hours = computeHours(rec.check_in, rec.check_out, rec.break_min);
  const regular = Math.min(hours, r.stdHours);
  const ot = Math.max(0, hours - r.stdHours);
  const otHourly = r.otRate>0 ? r.otRate : r.hourlyRate*r.otMultiplier;
  const pay = regular*r.hourlyRate + ot*otHourly;
  return {hours, regular, ot, pay};
}

async function loadRecords(){
  try{
    const {data} = await sb.from('attendance').select('*').eq('employee_id', currentUser.company_id).order('date',{ascending:true});
    records = data || [];
  }catch(e){ records=[]; }
  render();
}

function resetForm(){
  document.getElementById('entryForm').reset();
  document.getElementById('f-break').value=0;
  shiftBtns.forEach(x=>x.classList.remove('active'));
  document.querySelector('#entryForm .shift-toggle button[data-v="day"]').classList.add('active');
  document.getElementById('f-shift').value='day';
  editingId=null;
  document.getElementById('submitBtn').textContent='Add record';
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('editingFlag').classList.remove('show');
  document.getElementById('cancelBtn').classList.remove('show');
}
document.getElementById('cancelBtn').addEventListener('click', resetForm);

document.getElementById('entryForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  const data = {
    date: document.getElementById('f-date').value,
    shift: document.getElementById('f-shift').value,
    check_in: document.getElementById('f-in').value,
    check_out: document.getElementById('f-out').value,
    break_min: parseInt(document.getElementById('f-break').value)||0,
    remark: document.getElementById('f-note').value,
    employee_id: currentUser.company_id
  };
  try{
    if(editingId){
      const {error} = await sb.from('attendance').update(data).eq('id', editingId);
      if(error) throw error;
    } else {
      data.id = Date.now().toString(36);
      const {error} = await sb.from('attendance').insert(data);
      if(error) throw error;
    }
    await loadRecords();
    resetForm();
  }catch(err){ alert('Save failed: '+err.message); btn.disabled=false; }
});

function editRecord(id){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  editingId=id;
  document.getElementById('f-date').value=rec.date;
  document.getElementById('f-in').value=rec.check_in;
  document.getElementById('f-out').value=rec.check_out;
  document.getElementById('f-break').value=rec.break_min;
  document.getElementById('f-note').value=rec.remark||'';
  shiftBtns.forEach(x=>x.classList.remove('active'));
  document.querySelector(`#entryForm .shift-toggle button[data-v="${rec.shift}"]`).classList.add('active');
  document.getElementById('f-shift').value=rec.shift;
  document.getElementById('submitBtn').textContent='Update record';
  document.getElementById('editingFlag').classList.add('show');
  document.getElementById('cancelBtn').classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
}
window.editRecord = editRecord;

async function deleteRecord(id){
  if(!confirm('Delete this record?')) return;
  try{
    await sb.from('attendance').delete().eq('id', id);
    if(editingId===id) resetForm();
    await loadRecords();
  }catch(e){ alert('Delete failed: '+e.message); }
}
window.deleteRecord = deleteRecord;

document.getElementById('searchBox').addEventListener('input', render);

function render(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = records.filter(r=> !q || r.date.includes(q) || r.shift.includes(q) || (r.remark||'').toLowerCase().includes(q));
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = filtered.length===0 ? '<div class="empty">No records found.</div>' : filtered.map(rec=>{
    const c = computeRecord(rec);
    return `<div class="card">
      <div class="row1"><span class="date">${rec.date}</span><span class="badge ${rec.shift}">${rec.shift}</span></div>
      <div class="line"><span>In / Out</span><b>${rec.check_in} - ${rec.check_out}</b></div>
      <div class="line"><span>Hours</span><b>${c.hours.toFixed(2)}</b></div>
      <div class="line"><span>OT</span><b class="${c.ot>0?'ot-tag':''}">${c.ot.toFixed(2)}</b></div>
      <div class="line"><span>Pay</span><b>${c.pay.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</b></div>
      ${rec.remark?`<div class="remark">${rec.remark}</div>`:''}
      <div class="acts"><button onclick="editRecord('${rec.id}')">Edit</button><button class="del" onclick="deleteRecord('${rec.id}')">Delete</button></div>
    </div>`;
  }).join('');
  const t = records.reduce((a,rec)=>{ const c=computeRecord(rec); a.hours+=c.hours; a.ot+=c.ot; a.pay+=c.pay; a.days+=1; return a; },{hours:0,ot:0,pay:0,days:0});
  document.getElementById('summary').innerHTML = `
    <div class="cell"><div class="num">${t.days}</div><div class="lbl">Days logged</div></div>
    <div class="cell"><div class="num">${t.hours.toFixed(1)}</div><div class="lbl">Total hours</div></div>
    <div class="cell"><div class="num">${t.ot.toFixed(1)}</div><div class="lbl">OT hours</div></div>
    <div class="cell"><div class="num">${t.pay.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="lbl">Total pay</div></div>`;
}

function monthRecords(){
  const m = document.getElementById('exportMonth').value;
  return m ? records.filter(r=>r.date.startsWith(m)) : records;
}
document.getElementById('exportCsv').addEventListener('click', ()=>{
  const rows = monthRecords();
  const header=['Date','Shift','Check In','Check Out','Hours','OT Hours','Pay','Remark'];
  const lines = rows.map(rec=>{ const c=computeRecord(rec); const note=(rec.remark||'').replace(/"/g,'""');
    return [rec.date,rec.shift,rec.check_in,rec.check_out,c.hours.toFixed(2),c.ot.toFixed(2),c.pay.toFixed(2),`"${note}"`].join(','); });
  downloadCsv([header.join(','),...lines].join('\n'), `timecard_${currentUser.company_id}_${document.getElementById('exportMonth').value}.csv`);
});
document.getElementById('exportPdf').addEventListener('click', ()=>{ window.print(); });

function downloadCsv(csv, filename){
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

/* ===== ADMIN VIEW ===== */
function enterAdmin(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('adminScreen').classList.remove('hidden');
  document.getElementById('filterMonth').value = new Date().toISOString().slice(0,7);
  loadAdminData();
}

document.getElementById('tabEmp').addEventListener('click', ()=>switchTab('emp'));
document.getElementById('tabAtt').addEventListener('click', ()=>switchTab('att'));
function switchTab(t){
  document.getElementById('tabEmp').classList.toggle('active', t==='emp');
  document.getElementById('tabAtt').classList.toggle('active', t==='att');
  document.getElementById('adminEmployees').classList.toggle('hidden', t!=='emp');
  document.getElementById('adminAttendance').classList.toggle('hidden', t!=='att');
}

async function loadAdminData(){
  const {data: emps} = await sb.from('employees').select('*').order('company_id');
  allEmployees = emps || [];
  const {data: att} = await sb.from('attendance').select('*').order('date',{ascending:false});
  allAttendance = att || [];
  renderEmpList();
  renderEmpFilter();
  renderAdminCards();
}

function renderEmpFilter(){
  const sel = document.getElementById('filterEmp');
  sel.innerHTML = '<option value="">All employees</option>' + allEmployees.map(e=>`<option value="${e.company_id}">${e.name} (${e.company_id})</option>`).join('');
}

document.getElementById('addEmpBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('ne-id').value.trim();
  const name = document.getElementById('ne-name').value.trim();
  const pin = document.getElementById('ne-pin').value.trim();
  const rate = parseFloat(document.getElementById('ne-rate').value)||0;
  const std = parseFloat(document.getElementById('ne-std').value)||8;
  if(!id || !name || !pin){ alert('ID, name and PIN are required.'); return; }
  try{
    const {error} = await sb.from('employees').insert({company_id:id, name, pin, hourly_rate:rate, ot_multiplier:1.5, ot_rate:0, std_hours:std});
    if(error) throw error;
    ['ne-id','ne-name','ne-pin','ne-rate'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('ne-std').value = 8;
    await loadAdminData();
  }catch(e){ alert('Failed: '+e.message); }
});

function renderEmpList(){
  const el = document.getElementById('empList');
  if(allEmployees.length===0){ el.innerHTML='<div class="empty">No employees yet.</div>'; return; }
  el.innerHTML = allEmployees.map(e=>`
    <div class="emp-row">
      <input value="${e.company_id}" disabled>
      <input data-f="name" value="${e.name}">
      <input data-f="pin" value="${e.pin}">
      <input data-f="hourly_rate" type="number" step="0.01" value="${e.hourly_rate}">
      <input data-f="ot_multiplier" type="number" step="0.1" value="${e.ot_multiplier}">
      <input data-f="std_hours" type="number" step="0.5" value="${e.std_hours}">
      <button class="del" onclick="deleteEmp('${e.company_id}')">Delete</button>
    </div>`).join('');
  el.querySelectorAll('.emp-row input[data-f]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const row = inp.closest('.emp-row');
      const id = row.querySelector('input[disabled]').value;
      const field = inp.dataset.f;
      const val = inp.type==='number' ? parseFloat(inp.value)||0 : inp.value;
      try{ await sb.from('employees').update({[field]: val}).eq('company_id', id); }catch(e){ alert('Update failed: '+e.message); }
    });
  });
}

async function deleteEmp(id){
  if(!confirm(`Delete employee ${id} and all their attendance records?`)) return;
  try{
    await sb.from('attendance').delete().eq('employee_id', id);
    await sb.from('employees').delete().eq('company_id', id);
    await loadAdminData();
  }catch(e){ alert('Delete failed: '+e.message); }
}
window.deleteEmp = deleteEmp;

function empRates(empId){
  const e = allEmployees.find(x=>x.company_id===empId);
  if(!e) return rates;
  return {hourlyRate:Number(e.hourly_rate)||0, otMultiplier:Number(e.ot_multiplier)||1.5, otRate:Number(e.ot_rate)||0, stdHours:Number(e.std_hours)||8};
}

['filterEmp','filterMonth','adminSearch'].forEach(id=>document.getElementById(id).addEventListener('input', renderAdminCards));

function renderAdminCards(){
  const empF = document.getElementById('filterEmp').value;
  const monF = document.getElementById('filterMonth').value;
  const q = document.getElementById('adminSearch').value.toLowerCase();
  const filtered = allAttendance.filter(r=>{
    if(empF && r.employee_id!==empF) return false;
    if(monF && !r.date.startsWith(monF)) return false;
    if(q && !(r.date.includes(q) || r.shift.includes(q) || (r.remark||'').toLowerCase().includes(q))) return false;
    return true;
  });
  const el = document.getElementById('adminCards');
  el.innerHTML = filtered.length===0 ? '<div class="empty">No records found.</div>' : filtered.map(rec=>{
    const emp = allEmployees.find(e=>e.company_id===rec.employee_id);
    const c = computeRecord(rec, empRates(rec.employee_id));
    return `<div class="card">
      <div class="row1"><span class="badge emp">${emp?emp.name:rec.employee_id}</span><span class="badge ${rec.shift}">${rec.shift}</span></div>
      <div class="line"><span>Date</span><b>${rec.date}</b></div>
      <div class="line"><span>In / Out</span><b>${rec.check_in} - ${rec.check_out}</b></div>
      <div class="line"><span>Hours</span><b>${c.hours.toFixed(2)}</b></div>
      <div class="line"><span>OT</span><b class="${c.ot>0?'ot-tag':''}">${c.ot.toFixed(2)}</b></div>
      <div class="line"><span>Pay</span><b>${c.pay.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</b></div>
      ${rec.remark?`<div class="remark">${rec.remark}</div>`:''}
      <div class="acts"><button onclick="deleteAdminRecord('${rec.id}')" class="del">Delete</button></div>
    </div>`;
  }).join('');
}

async function deleteAdminRecord(id){
  if(!confirm('Delete this record?')) return;
  try{ await sb.from('attendance').delete().eq('id', id); await loadAdminData(); }catch(e){ alert('Delete failed: '+e.message); }
}
window.deleteAdminRecord = deleteAdminRecord;

document.getElementById('adminExportCsv').addEventListener('click', ()=>{
  const empF = document.getElementById('filterEmp').value;
  const monF = document.getElementById('filterMonth').value;
  const rows = allAttendance.filter(r=> (!empF || r.employee_id===empF) && (!monF || r.date.startsWith(monF)) );
  const header=['Employee ID','Name','Date','Shift','Check In','Check Out','Hours','OT Hours','Pay','Remark'];
  const lines = rows.map(rec=>{
    const emp = allEmployees.find(e=>e.company_id===rec.employee_id);
    const c = computeRecord(rec, empRates(rec.employee_id));
    const note = (rec.remark||'').replace(/"/g,'""');
    return [rec.employee_id, emp?emp.name:'', rec.date, rec.shift, rec.check_in, rec.check_out, c.hours.toFixed(2), c.ot.toFixed(2), c.pay.toFixed(2), `"${note}"`].join(',');
  });
  downloadCsv([header.join(','),...lines].join('\n'), `all_attendance_${monF||'all'}.csv`);
});

trySession();
</script>
